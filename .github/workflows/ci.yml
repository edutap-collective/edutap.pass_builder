name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Settings() requires these three; individual test modules also set safe
  # defaults via `os.environ.setdefault` (see tests/routers/conftest.py), but
  # declaring them here keeps import-time `Settings()` construction safe
  # regardless of collection order. testcontainers provisions its own
  # Postgres per test session and ignores this DATABASE_URL.
  EDUTAP_PASS_BUILDER_DATABASE_URL: postgresql+asyncpg://unused/unused
  EDUTAP_PASS_BUILDER_SECRET_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  EDUTAP_PASS_BUILDER_DATA_PROVIDER_BASE_URL: http://data-provider.invalid

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # uv reads this, so no step needs a version-specific flag.
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # ONE environment, managed by uv. The previous version used three: it
      # installed an interpreter, then wrote the package into the runner's
      # SYSTEM Python with `--system` -- which Ubuntu marks as externally
      # managed (PEP 668), so the job died right there -- and then `uv run`
      # would have used a third. The failure was not in any test; it happened
      # before the first one was collected, which is why every run since
      # 2026-08-07 was red without naming a cause.
      #
      # `uv sync` honours uv.lock, so the CI resolves what a developer
      # resolved rather than whatever is newest that morning.
      - name: Install the project with its dev and docs extras
        run: uv sync --extra dev --extra docs

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run ty check

      - name: Test
        # testcontainers spins up its own Postgres via the Docker daemon
        # that ubuntu-latest runners already provide, so no `services:`
        # block is needed for the non-integration suite.
        run: uv run pytest -m "not integration"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the application image
        run: docker build -t pass-builder:ci .
