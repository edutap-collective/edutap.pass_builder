name: Publish container image

# Publishes the service image to the GitHub Container Registry.
#
# The image name follows the repository name (`github.repository`), so a
# repository rename carries the image with it and no name is duplicated here.
# That property matters: the packages under the pre-rename names are stale by
# design, and nothing in this file has to be touched when a repository moves.

on:
  push:
    branches: ["main"]
    # Date versions, the shape every sibling in this estate publishes:
    # 2026-09-02_2032. NOT `v*.*.*` -- this image is not released on a semantic
    # version, it is released when a deployment needs it, and a date answers
    # "which build is this" without looking anything up.
    tags: ["20[0-9][0-9]-[0-1][0-9]-[0-3][0-9]_[0-2][0-9][0-5][0-9]"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# A second push to the same branch supersedes the first; a half-finished build
# of an outdated commit is never worth the runner minutes.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped on pull requests: a fork must not be able to push an image.
      # The build itself still runs, so a broken Dockerfile fails the review.
      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` only ever points at main. Deployments that pin a version
          # use the date tag; the sha tag is the unambiguous fallback.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            # `type=ref,event=tag` takes the tag name VERBATIM, which is what a
            # date version needs. The two `type=semver` rules that stood here
            # produced NOTHING for a tag like 2026-09-02_2032 -- and did so
            # silently: the build ran, reported success, and pushed only
            # `sha-<...>`. A green run that published no usable tag is worse
            # than a failed one, because nobody goes looking.
            #
            # The cost of that was real: the deployment could only pin
            # `latest@sha256:...`. The digest decides, but the label answers
            # nothing -- "which build is running here" then needs a lookup, at
            # the moment when somebody is trying to find out why something
            # broke.
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
