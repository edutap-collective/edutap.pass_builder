[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edutap.pass_builder"
version = "0.1.0"
description = "Stateless service building Apple and Google wallet passes from versioned templates"
readme = "README.md"
requires-python = ">=3.12"
license = "EUPL-1.2"
authors = [{ name = "eduTAP" }]
dependencies = [
    "aioboto3>=13",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "cryptography>=43",
    "edutap.wallet-apple>=1.0.0a2",
    "edutap.wallet-google>=3.0.0b1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pdbp",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
    "ty",
]
docs = ["myst-parser", "sphinx>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/edutap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: needs docker compose services and a test certificate",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "D", "S"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101"]

[tool.ty.environment]
root = ["./src"]
