[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edutap.pass_builder"
version = "0.1.0"
description = "Stateless service building Apple and Google wallet passes from versioned templates"
readme = "README.md"
# 3.13, nicht 3.12: `edutap.data_models` verlangt es, und dieses Repo fuhr die
# Untergrenze ohnehin nur als Absicht -- es gibt keine Testmatrix, und das Image ist
# python:3.14-slim. 3.12 bleibt bis 2028 unterstuetzt, wird hier aber von nichts
# gebraucht.
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "EUPL-1.2"
authors = [{ name = "eduTAP" }]
dependencies = [
    "aioboto3>=13",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "cryptography>=43",
    # The shared vocabulary. `WalletType` lives there, not here: a copy of a shared
    # enum is a second truth, and the copy that stood in `models/enums.py` was on the
    # coarse provider axis -- it could not express VAS versus Access at all.
    "edutap.data_models>=0.3,<0.4",
    # How this service reaches the cluster: every node, the primary among them,
    # TLS per driver, and the password as a mounted file. All of it lives in
    # `ClusterSettings`, so this is a runtime dependency now and no longer only
    # the development one the entry point below needs.
    #
    # NOT BELOW 0.3.2. Earlier versions declare no `secrets_dir`, and the failure
    # mode of that is silence: the mounted password is never read, and nothing
    # observable separates it from a deployment that has no secret at all. It
    # crash-looped two sibling services on 2026-08-27 for exactly that reason.
    "edutap.db_definitions>=0.3.2,<0.4",
    # Errors, traces and structured logging. `[fastapi]` because this service is
    # one, and the extra is what carries the instrumentation.
    "edutap.observability_settings[fastapi]>=0.1.6,<0.2",
    "edutap.wallet-apple>=1.0.0a2",
    "edutap.wallet-google>=3.0.0b1",
    "fastapi>=0.115",
    "greenlet>=3",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pdbp",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
    "ty",
]
docs = ["myst-parser", "sphinx>=8"]

# How `edutap.db_definitions` finds this package's tables. Several packages share
# one database; the tool scans this entry point to check them against each other
# for colliding names and for types left to `search_path`.
#
# The package is a runtime dependency since 2026-09-01 (`ClusterSettings`), so
# `models/dbdef.py` imports it directly. The guard that used to sit there could
# no longer trigger, and a guard that cannot trigger asserts a design that is no
# longer true.
[project.entry-points."edutap.db_definitions"]
schema = "edutap.pass_builder.models.dbdef:definition"

[tool.hatch.build.targets.wheel]
packages = ["src/edutap"]
# The built single-page application. `.gitignore` keeps it out of the
# repository -- it is a build product -- and hatchling excludes ignored files
# by default, so without this line the wheel ships an API with no interface in
# front of it and nothing says why.
artifacts = ["src/edutap/pass_builder/ui/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So that `tests.dbschema` -- the shared helper that creates this package's
# schema before its tables -- is importable from every test file, including the
# ones under `tests/services/`, which is a package and therefore does not get its
# own directory on `sys.path`.
pythonpath = ["."]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs docker compose services and a test certificate",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "D", "S"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101"]

[tool.ty.environment]
# The repository root, not "./tests": the suite imports its helper as
# `tests.dbschema`, so what has to be importable is the package `tests`, which
# lives at the root. With "./tests" on the path a module inside it resolves as
# `dbschema` instead, and every `from tests.dbschema import ...` was reported as
# an unresolved import -- ten of the twelve diagnostics this check produced.
root = ["./src", "."]
